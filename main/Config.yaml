#
#  Configvar definitions
#

#
#  all NVS namespaces must be defined before they can be used
#
namespaces:

- system_config
- wifi_config

configvars:

- name: factory_default_boot
  c_type: uint8_t
  nv_type: U8
  default: 0
  namespace: system_config
  key: fdb
  description: 'Normally 0. Set to 1 to initiate factory default reset of NVRAM on next boot.'

- name: wifi_pw
  c_type: string_c
  nv_type: STRING
  default: ''
  namespace: wifi_config
  key: wfpw
  max_length: 65
  cached: yes

- name: wifi_ssid
  c_type: string_c
  nv_type: STRING
  default: ''
  namespace: wifi_config
  key: ssid
  max_length: 33
  cached: yes

